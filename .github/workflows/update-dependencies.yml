name: Update Go Dependencies

on:
  schedule:
    # Runs every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base: [main, nginx-local]
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout ${{ matrix.base }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.base }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Update dependencies
        run: |
          go get -u ./...
          go mod tidy

      - name: Test
        run: go test ./...

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          base: ${{ matrix.base }}
          branch: deps/update-${{ matrix.base }}
          add-paths: |
            go.mod
            go.sum
          commit-message: "chore: update dependencies"
          title: "chore: update Go dependencies (${{ matrix.base }})"
          body: |
            Updates Go dependencies on `${{ matrix.base }}` with `go get -u ./...`
            and cleans the module files with `go mod tidy`.
          labels: dependencies, automated
